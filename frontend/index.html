<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Explorer - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #2c5530, #4a7c59, #6b8e23, #228b22);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            width: 4px;
            height: 4px;
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            width: 6px;
            height: 6px;
            top: 60%;
            left: 80%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            width: 3px;
            height: 3px;
            top: 80%;
            left: 30%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            width: 5px;
            height: 5px;
            top: 40%;
            left: 70%;
            animation-delay: 1s;
        }

        .particle:nth-child(5) {
            width: 4px;
            height: 4px;
            top: 10%;
            left: 60%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
        }

        /* Nature overlay images */
        .nature-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:%2387CEEB;stop-opacity:0.3" /><stop offset="100%" style="stop-color:%234682B4;stop-opacity:0.1" /></linearGradient></defs><rect width="1000" height="1000" fill="url(%23sky)"/><polygon points="0,800 200,600 400,700 600,500 800,600 1000,400 1000,1000 0,1000" fill="%23228B22" opacity="0.6"/><polygon points="100,900 300,700 500,800 700,600 900,700 1000,500 1000,1000 0,1000" fill="%2332CD32" opacity="0.4"/><circle cx="200" cy="200" r="50" fill="%23FFD700" opacity="0.7"/><polygon points="150,300 200,250 250,300 225,350 175,350" fill="%23228B22" opacity="0.8"/><polygon points="350,250 400,200 450,250 425,300 375,300" fill="%2332CD32" opacity="0.8"/><polygon points="750,350 800,300 850,350 825,400 775,400" fill="%23228B22" opacity="0.8"/></svg>') no-repeat center center;
            background-size: cover;
            opacity: 0.6;
            z-index: 1;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            height: 100vh;
            padding-left: 5%;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 0 80px rgba(34, 139, 34, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateX(0);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-container.shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #2c5530;
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c5530;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a7c59;
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
            transform: translateY(-2px);
        }

        .form-group input:valid {
            border-color: #228b22;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4a7c59, #228b22);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(34, 139, 34, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
        }

        .form-footer p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .toggle-link {
            color: #4a7c59;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .toggle-link:hover {
            color: #228b22;
            text-decoration: underline;
        }

        .form-container {
            position: relative;
            overflow: hidden;
        }

        .form {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form.hidden {
            opacity: 0;
            transform: translateX(-100%);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .form.entering {
            opacity: 1;
            transform: translateX(0);
        }

        /* Success message */
        .success-message {
            background: rgba(34, 139, 34, 0.1);
            border: 1px solid #228b22;
            color: #228b22;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .success-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading {
            pointer-events: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                justify-content: center;
            }
            
            .login-container {
                width: 90%;
                max-width: 400px;
            }
            
            .nature-overlay {
                width: 100%;
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="nature-overlay"></div>
    
    <div class="container">
        <div class="login-container" id="loginContainer">
            <div class="form-container">
                <!-- Login Form -->
                <div class="form" id="loginForm">
                    <div class="form-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to continue your nature exploration</p>
                    </div>
                    
                    <div class="success-message" id="loginSuccess">
                        Successfully logged in! Welcome back explorer.
                    </div>
                    
                    <form id="loginFormElement">
                        <div class="form-group">
                            <label for="loginEmail">Email Address</label>
                            <input type="email" id="loginEmail" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn" id="loginBtn">
                            Sign In
                        </button>
                    </form>
                    
                    <div class="form-footer">
                        <p>Don't have an account?</p>
                        <a href="#" class="toggle-link" onclick="toggleForm('register')">Create Account</a>
                    </div>
                </div>
                
                <!-- Register Form -->
                <div class="form hidden" id="registerForm">
                    <div class="form-header">
                        <h2>Join Nature Explorer</h2>
                        <p>Create your account to start exploring</p>
                    </div>
                    
                    <div class="success-message" id="registerSuccess">
                        Account created successfully! You can now sign in.
                    </div>
                    
                    <form id="registerFormElement">
                        <div class="form-group">
                            <label for="registerName">Full Name</label>
                            <input type="text" id="registerName" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="registerEmail">Email Address</label>
                            <input type="email" id="registerEmail" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="registerPassword">Password</label>
                            <input type="password" id="registerPassword" name="password" required minlength="6">
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        
                        <button type="submit" class="btn" id="registerBtn">
                            Create Account
                        </button>
                    </form>
                    
                    <div class="form-footer">
                        <p>Already have an account?</p>
                        <a href="#" class="toggle-link" onclick="toggleForm('login')">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentForm = 'login';
        
        function toggleForm(formType) {
            if (currentForm === formType) return;
            
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const container = document.getElementById('loginContainer');
            
            // Add transition effect
            container.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                if (formType === 'register') {
                    loginForm.classList.add('hidden');
                    registerForm.classList.remove('hidden');
                    registerForm.classList.add('entering');
                } else {
                    registerForm.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    loginForm.classList.add('entering');
                }
                
                currentForm = formType;
                container.style.transform = 'scale(1)';
                
                // Reset success messages
                document.getElementById('loginSuccess').classList.remove('show');
                document.getElementById('registerSuccess').classList.remove('show');
            }, 150);
        }
        
        function showLoading(buttonId) {
            const btn = document.getElementById(buttonId);
            const originalText = btn.innerHTML;
            btn.classList.add('loading');
            btn.innerHTML = '<span class="loading"></span>Processing...';
            
            return () => {
                btn.classList.remove('loading');
                btn.innerHTML = originalText;
            };
        }
        
        function showSuccess(messageId) {
            const message = document.getElementById(messageId);
            message.classList.add('show');
            
            setTimeout(() => {
                message.classList.remove('show');
            }, 3000);
        }
        
        function addShakeEffect() {
            const container = document.getElementById('loginContainer');
            container.classList.add('shake');
            setTimeout(() => {
                container.classList.remove('shake');
            }, 500);
        }
        
        // Login form handler
        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                addShakeEffect();
                return;
            }
            
            const stopLoading = showLoading('loginBtn');
            
            // Simulate API call
            setTimeout(() => {
                stopLoading();
                showSuccess('loginSuccess');
                
                // Reset form
                setTimeout(() => {
                    document.getElementById('loginFormElement').reset();
                }, 1000);
            }, 2000);
        });
        
        // Register form handler
        document.getElementById('registerFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!name || !email || !password || !confirmPassword) {
                addShakeEffect();
                return;
            }
            
            if (password !== confirmPassword) {
                addShakeEffect();
                alert('Passwords do not match!');
                return;
            }
            
            if (password.length < 6) {
                addShakeEffect();
                alert('Password must be at least 6 characters long!');
                return;
            }
            
            const stopLoading = showLoading('registerBtn');
            
            // Simulate API call
            setTimeout(() => {
                stopLoading();
                showSuccess('registerSuccess');
                
                // Reset form and switch to login after success
                setTimeout(() => {
                    document.getElementById('registerFormElement').reset();
                    toggleForm('login');
                }, 2000);
            }, 2000);
        });
        
        // Add floating animation to particles
        function createFloatingParticles() {
            const particles = document.querySelectorAll('.particle');
            particles.forEach((particle, index) => {
                const randomDelay = Math.random() * 2;
                const randomDuration = 4 + Math.random() * 4;
                particle.style.animationDelay = randomDelay + 's';
                particle.style.animationDuration = randomDuration + 's';
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createFloatingParticles();
            
            // Add entrance animation to container
            const container = document.getElementById('loginContainer');
            container.style.opacity = '0';
            container.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 300);
        });
    </script>
</body>
</html>
